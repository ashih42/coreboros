[package]
name = "coreboros"
version = "0.1.0"
edition = "2024"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[[bin]]
name = "asm"
path = "src/bin/asm.rs"

[[bin]]
name = "game"
path = "src/bin/game.rs"

[dependencies]
anyhow = "1.0.104"
derive_more = { version = "2.1.1", features = ["display"] }
egui-macroquad = "0.17.3"
elsa = "1.11.2"
env_logger = "0.11.11"
indoc = "2.0.7"
log = "0.4.33"
macroquad = "0.4.16"
pest = "2.8.8"
pest_consume = "1.1.3"
pest_derive = "2.8.8"
rand = "0.10.2"
regex = "1.13.1"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
